name: IndexNow

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/projects/**'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/indexnow.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Notify IndexNow after production deploy
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # The same production deployment, without the custom-domain bot challenge.
          # Submitted URLs and keyLocation still use https://jpclow.dev.
          INDEXNOW_FETCH_ORIGIN: 'https://portfolio-44w.pages.dev'
        run: node scripts/submit-indexnow.mjs
